[project]
name = "wildfireiq-api"
version = "0.1.0"
description = "WildfireIQ Kamloops backend — ingestion, ML inference, REST API."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Deeparsh Singh Dang" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "pandas>=2.2",
    "numpy>=1.26,<3",
    "apscheduler>=3.10",
    "structlog>=24.4",
    "tenacity>=9.0",
    # Geo, parsing, and ML
    "shapely>=2.0",
    "pyarrow>=17.0",
    "h3>=4.1",
    "scikit-learn>=1.8.0",
    "lightgbm>=4.6.0",
    "joblib>=1.5.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wildfireiq_api"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
# E501: long lines are acceptable in prose docstrings and URL constants.
# RUF001/002/003: docstrings and comments deliberately use typographic
# characters (en dash, arrows, >=, x) for readability.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# The default run must not depend on the internet. Three smoke tests do — they
# call the real upstream feeds — so they are marked `live` and deselected here.
# Run them deliberately with `make test-live`.
addopts = "-m 'not live'"
markers = [
  "live: hits a real upstream API; excluded from the default run",
]
